name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (type-check, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The real .env is gitignored. src/config/firebase.ts throws at import
      # when the Firebase keys are absent, and several service tests import
      # it, so the example's placeholders stand in — nothing here connects
      # to Firebase, the values only need to exist.
      - name: Provide placeholder env
        run: cp .env.example .env

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run

      - name: Production build
        run: npx vite build --mode production

  rules:
    name: Firestore security rules (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # The Firestore emulator is a Java program; firebase-tools 13 needs 11+.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-13.35.1

      - run: npm ci

      # tests/firestore.rules.test.mjs runs firestore.rules as four principals
      # (staff, doctor, clinic-admin, another clinic). Until this job existed
      # the suite was never run by CI, and three security-relevant rules
      # changes shipped with no corresponding test.
      - name: Rules tests
        run: npm run test:rules

  backend:
    name: Billing backend (tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: billing-backend
    env:
      SPRING_PROFILES_ACTIVE: test
      # Startup decrypts stored IRD credentials with this key; the test
      # profile has no rows to decrypt, so any valid 32-byte key will do.
      IRD_CONFIG_ENC_KEY: 2gojAuFu1LtI+rCHSJb+GYlrCmbyGev6RJwLhJN0gDw=
      DB_PASSWORD: unused-under-h2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      # mvnw is checked in without the executable bit (Windows checkout).
      - name: Tests (H2 in-memory, test profile)
        run: bash ./mvnw -B -q test
