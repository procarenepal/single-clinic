# Server settings
server.port=8080

# Database Configuration (MySQL)
# DB_USERNAME / DB_PASSWORD MUST be set via environment variables — no default
# password is committed here on purpose. Startup fails if DB_PASSWORD is unset.
# DB_HOST/DB_PORT/DB_NAME default to the local-dev values but MUST be overridden
# via environment variables in production — nothing here assumes localhost.
db.host=${DB_HOST:localhost}
db.port=${DB_PORT:3306}
db.name=${DB_NAME:procare_billing}
spring.datasource.url=jdbc:mysql://${db.host}:${db.port}/${db.name}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Configuration
# Schema is now Flyway-managed (see db/migration) — Hibernate only validates
# that entities match what Flyway created, it never alters the schema itself.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway Configuration
# baseline-on-migrate lets Flyway adopt a database that already has this schema
# (e.g. one previously created by ddl-auto=update) by stamping it as already
# being at V1, instead of trying to re-run V1's CREATE TABLEs against it.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# CORS Configuration — see config/CorsConfig.java. Comma-separated allowed origins.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Firebase Admin SDK credential — see config/FirebaseConfig.java.
# Set exactly one of these via environment variable. Never commit a service account file.
firebase.service-account.json=${FIREBASE_SERVICE_ACCOUNT_JSON:}
firebase.service-account.path=${FIREBASE_SERVICE_ACCOUNT_PATH:}
# Storage bucket used for both logo/document uploads (frontend) and, from this
# backend, scheduled MySQL backups — see service/DatabaseBackupService.java.
firebase.storage-bucket=${FIREBASE_STORAGE_BUCKET:skincare-hospital.firebasestorage.app}

# Scheduled MySQL backup — IRD's Electronic Invoice Procedure (दफा ६घ/७घ) requires
# annual database + log backups. Runs daily by default (stricter than the legal
# minimum). Disable in an environment with no mysqldump binary via BACKUP_ENABLED=false.
backup.enabled=${BACKUP_ENABLED:true}
backup.cron=${BACKUP_CRON:0 0 2 * * *}

# Base64-encoded 32-byte AES-256 key used to encrypt clinic_ird_config.ird_api_password at rest.
# Generate with: openssl rand -base64 32
ird.config.encryption-key=${IRD_CONFIG_ENC_KEY:}
