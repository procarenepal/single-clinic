# Server settings
server.port=8080

# Database Configuration (MySQL)
# DB_USERNAME / DB_PASSWORD MUST be set via environment variables — no default
# password is committed here on purpose. Startup fails if DB_PASSWORD is unset.
spring.datasource.url=jdbc:mysql://localhost:3306/procare_billing?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Configuration
# Schema is now Flyway-managed (see db/migration) — Hibernate only validates
# that entities match what Flyway created, it never alters the schema itself.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway Configuration
# baseline-on-migrate lets Flyway adopt a database that already has this schema
# (e.g. one previously created by ddl-auto=update) by stamping it as already
# being at V1, instead of trying to re-run V1's CREATE TABLEs against it.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# CORS Configuration — see config/CorsConfig.java. Comma-separated allowed origins.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Firebase Admin SDK credential — see config/FirebaseConfig.java.
# Set exactly one of these via environment variable. Never commit a service account file.
firebase.service-account.json=${FIREBASE_SERVICE_ACCOUNT_JSON:}
firebase.service-account.path=${FIREBASE_SERVICE_ACCOUNT_PATH:}

# Base64-encoded 32-byte AES-256 key used to encrypt clinic_ird_config.ird_api_password at rest.
# Generate with: openssl rand -base64 32
ird.config.encryption-key=${IRD_CONFIG_ENC_KEY:}
