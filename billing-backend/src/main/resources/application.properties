# Server settings
server.port=8080

# Database Configuration (MySQL)
# Override DB_USERNAME / DB_PASSWORD as environment variables if your local MySQL
# credentials differ from the defaults below.
spring.datasource.url=jdbc:mysql://localhost:3306/procare_billing?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Karan@1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# CORS Configuration (Allows React frontend running on Vite default port to connect)
# NOTE: these spring.mvc.cors.* properties aren't wired to anything in this app -- the
# @CrossOrigin annotation on BillingController is what actually enforces CORS.
spring.mvc.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.mvc.cors.allowed-headers=*

# IRD Configuration for Background Sync
# Note: These values can be overridden via environment variables in production.
ird.api.enabled=true
ird.api.url=https://cbms.ird.gov.np/api/bill
ird.api.username=${IRD_USERNAME:test_user}
ird.api.password=${IRD_PASSWORD:test_password}
ird.api.seller-pan=${IRD_SELLER_PAN:123456789}
