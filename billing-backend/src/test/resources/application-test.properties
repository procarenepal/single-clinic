# In-memory H2 for tests — isolated from the real MySQL dev/prod database.
spring.datasource.url=jdbc:h2:mem:billing_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Tests build schema straight from entities via create-drop above; Flyway
# (MySQL-only migrations) is irrelevant here and would just conflict with it.
spring.flyway.enabled=false

# Headroom for the concurrency test's thread pool (see InvoiceSequenceServiceTest) —
# the default max (10) is too tight once other in-flight connections are counted.
spring.datasource.hikari.maximum-pool-size=25

# No Firebase service account in tests — FirebaseConfig stays uninitialized on
# purpose, so requests correctly fail closed with 401 (see FirebaseAuthFilter).
firebase.service-account.json=
firebase.service-account.path=

# 32-byte key, base64 — test-only, never used outside this profile.
ird.config.encryption-key=MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=

cors.allowed-origins=http://localhost:5173
